name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore RoboticAssemblyPlanner.sln
      - run: dotnet build RoboticAssemblyPlanner.sln --configuration Release --no-restore
      - run: dotnet test RoboticAssemblyPlanner.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
